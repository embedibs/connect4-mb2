[package]
name = "connect4-mb2"
version = "0.1.0"
authors = ["ethan dibble <edibble@pdx.edu>"]
edition = "2024"

[dependencies]
cortex-m-rt = "0.7"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
heapless = "0.9.2"
mipidsi = "0.8.0"
panic-rtt-target = "0.2"
rtt-target = "0.6"

[dependencies.cortex-m]
version = "0.7"
features = ["inline-asm", "critical-section-single-core"]

[dependencies.microbit-v2]
version = "0.16.0"
git = "https://github.com/nrf-rs/microbit"

[dependencies.oxid8-core]
git = "https://github.com/edibblepdx/Oxid-8"
branch = "feature/packed_screen"
default-features = false
